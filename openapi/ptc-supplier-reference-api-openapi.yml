openapi: 3.2.0
info:
  title: Ptc Supplier Reference API
  version: '1.0'
  contact:
    email: arena-support@ptc.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://www.arenasolutions.com/terms/
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  description: 'Operations tagged Supplier Reference across 2 of this provider''s published API definitions: ptc-arena-openapi.json, ptc-arena-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /v1
- url: https://api.arenasolutions.com/v1
  description: Relative /v1 server resolved against api.arenasolutions.com, the host serving this spec
security:
- apiKeyAuth: []
- bearerAuth: []
- oauth2Auth: []
tags:
- name: Supplier Reference
  description: Access supplier and supplier quality information.
paths:
  /suppliers/{supplierGuid}/quality:
    get:
      tags:
      - Supplier Reference
      summary: List all quality processes linked to a supplier
      description: Returns a collection of Quality Process objects for a supplier with a given GUID (all Quality Processes in which the Supplier is an affected object).
      operationId: getSupplierQualityProcesses
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeQualityAssociationVoResultRep'
    servers:
    - url: /v1
  /suppliers/{supplierGuid}/quality/{supplierQualityAssociationGuid}:
    get:
      tags:
      - Supplier Reference
      summary: Get details of a specific quality process linked to a supplier
      operationId: getSupplierQualityProcess
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      - name: supplierQualityAssociationGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityAssociationVo'
    servers:
    - url: /v1
components:
  schemas:
    ErrorObject:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    QualityProcessReferenceVo:
      type: object
      properties:
        guid:
          type: string
        name:
          type: string
        number:
          type: string
        step:
          $ref: '#/components/schemas/QualityStepReferenceVo'
        type:
          type: string
    QualityStepReferenceVo:
      type: object
      properties:
        guid:
          type: string
        name:
          type: string
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorObject'
      xml:
        name: errors
    ChangeQualityAssociationVoResultRep:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/QualityAssociationVo'
        count:
          type: integer
          format: int32
      xml:
        name: results
    QualityAssociationVo:
      type: object
      properties:
        guid:
          type: string
        notes:
          type: string
        qualityProcess:
          $ref: '#/components/schemas/QualityProcessReferenceVo'
  securitySchemes:
    oauth2Auth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://openauth.web.prod.bom.com:4431
          scopes: {}
    apiKeyAuth:
      type: apiKey
      name: arena_session_id
      in: header
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-refined-from:
- ptc-arena-openapi.json
- ptc-arena-openapi.yml
