components:
  schemas:
    AttributeGroupFullVoResultRep:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AttributeGroupFullVo'
        count:
          type: integer
          format: int32
      xml:
        name: results
    AttributeGroupCascadingRuleVo:
      type: object
      properties:
        drivingAttributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeGroupDrivingAttributeVo'
        order:
          type: integer
          format: int32
        dependentAttributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeGroupDependentAttributeVo'
    ErrorObject:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorObject'
      xml:
        name: errors
    AttributeDefinitionFullRepResultRep:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AttributeDefinitionVo'
        count:
          type: integer
          format: int32
      xml:
        name: results
    AttributeGroupConditionalRuleVo:
      type: object
      properties:
        drivingAttributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeGroupDrivingAttributeVo'
        order:
          type: integer
          format: int32
        required:
          type: boolean
        dependentAttributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeGroupConditionDependentAttrVo'
    AttributeDefinitionFullRep:
      type: object
      properties:
        allowsExplicitNullValue:
          type: boolean
        allowLowerCase:
          type: boolean
        allowNegatives:
          type: boolean
        allowNumbers:
          type: boolean
        allowUpperCase:
          type: boolean
        costCalculation:
          type: string
          enum:
          - ENTERED
          - ROLLUP
          - ROLLUP_AND_ENTERED
        currency:
          type: string
          enum:
          - USD
          - EUR
          - GBP
          - YEN
          - AUD
          - CAD
          - CNY
          - INR
          - JPY
          - KRW
          - NZD
          - SEK
          - DKK
          - NOK
        decimalPlaces:
          type: integer
          format: int32
        defaultValue: {}
        deprecated:
          type: boolean
        description:
          type: string
        developerNotes:
          type: string
        example:
          type: string
        excludedValues:
          type: array
          items:
            type: string
        fieldType:
          type: string
          enum:
          - SINGLE_LINE_TEXT
          - MULTI_LINE_TEXT
          - DROP_DOWN
          - FIXED_DROP_DOWN
          - DATE
          - NUMBER
          - BOOLEAN
          - INTEGER
          - OBJECT
          - POSITIVE_DOUBLE
          - POSITIVE_INTEGER
          - RICH_TEXT
          - GUID
          - DATETIME
          - COST
          - LIST
          - ENUM
        inViews:
          type: array
          items:
            type: string
            enum:
            - EMPTY_VIEW
            - ITEM_SPECS
            - ITEM_BOM
            - ITEM_WHEREUSED
            - ITEM_SOURCING
            - ITEM_COSTING
            - ITEM_FILES
            - ITEM_COMPLIANCE
            - ITEM_REVISIONS
            - ITEM_NOTIFICATIONS
            - ITEM_SUPPLIER_ACCESS
            - ITEM_PROJECTS
            - ITEM_QUALITY
            - ITEM_CUSTOM
            - ITEM_CUSTOM_NON_REV
            - ITEM_TRAINING
            - ITEM_TRAINING_PLANS
            - ITEM_TRAINING_RECORDS
            - ITEM_TRAINING_QUIZ
            - ITEM_TRAINING_QUIZ_HISTORY
            - ITEM_VERIFY
            - ITEM_REFERENCES
            - REQUEST_SUMMARY
            - REQUEST_FILES
            - REQUEST_ITEMS
            - REQUEST_PARTICIPANTS
            - REQUEST_EVALUATION
            - REQUEST_CHANGES
            - REQUEST_STATUS
            - REQUEST_RECENT_ACTIVITY
            - REQUEST_PROJECTS
            - REQUEST_QUALITY
            - REQUEST_CUSTOM
            - CHANGE_SUMMARY
            - CHANGE_FILES
            - CHANGE_ITEMS
            - CHANGE_REQUESTS
            - CHANGE_APPROVAL_ROUTINGS
            - CHANGE_APPROVAL_DECISIONS
            - CHANGE_IMPLEMENTATION
            - CHANGE_ALERTS
            - CHANGE_NOTIFICATIONS
            - CHANGE_STATUS
            - CHANGE_PROJECTS
            - CHANGE_QUALITY
            - CHANGE_SUPPLIER_ACCESS
            - CHANGE_CUSTOM
            - CHANGE_VERIFY
            - SUPPLIER_PROFILE
            - SUPPLIER_CONTACTS
            - SUPPLIER_SUPPLIER_ITEMS
            - SUPPLIER_SOURCING_LINES
            - SUPPLIER_SOURCED_ITEMS
            - SUPPLIER_FILES
            - SUPPLIER_QUALITY
            - SUPPLIER_CUSTOM
            - SUPPLIER_ITEMS_QUALITY
            - SI_SPECS
            - SI_SOURCING_LINES
            - SI_QUOTES
            - SI_PURCHASES
            - SI_FILES
            - SI_COMPLIANCE
            - SI_LOOKUP
