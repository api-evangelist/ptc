openapi: 3.2.0
info:
  title: Ptc Attribute Settings API
  version: '1.0'
  contact:
    email: arena-support@ptc.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://www.arenasolutions.com/terms/
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  description: 'Operations tagged Attribute Settings across 2 of this provider''s published API definitions: ptc-arena-openapi.json, ptc-arena-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /v1
- url: https://api.arenasolutions.com/v1
  description: Relative /v1 server resolved against api.arenasolutions.com, the host serving this spec
security:
- apiKeyAuth: []
- bearerAuth: []
- oauth2Auth: []
tags:
- name: Attribute Settings
  description: Manage settings for attributes across various objects (Item, BOM, File, Request, Change, Quality, Ticket, Supplier, Export).
paths:
  /settings/{objectType}/attributes:
    get:
      tags:
      - Attribute Settings
      summary: Search for attributes by object type
      description: Search for attributes by object type. Supports Item, File, Quality Process, Supplier, Supplier Item, Change, Request, Ticket, and Training Plan objects.
      operationId: getAttributesDefinitions
      parameters:
      - name: objectType
        in: path
        required: true
        schema:
          type: string
          enum:
          - items
          - files
          - qualityprocesses
          - suppliers
          - supplieritems
          - changes
          - requests
          - tickets
          - trainingplans
          - requirements
      - name: includePossibleValues
        in: query
        required: false
        schema:
          type: boolean
      - name: creatableOnly
        in: query
        required: false
        schema:
          type: boolean
      - name: editableOnly
        in: query
        required: false
        schema:
          type: boolean
      - name: searchableOnly
        in: query
        required: false
        schema:
          type: boolean
      - name: includeDeleted
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeDefinitionFullRepResultRep'
    servers:
    - url: /v1
  /settings/{objectType}/attributegroups:
    get:
      tags:
      - Attribute Settings
      summary: Search for attribute groups by object type
      description: Search for attribute groups by object type. Supports Items, Changes, Suppliers,and Request objects.
      operationId: getAttributesGroups
      parameters:
      - name: objectType
        in: path
        required: true
        schema:
          type: string
          enum:
          - items
          - changes
          - suppliers
          - requests
          - supplieritems
      responses:
