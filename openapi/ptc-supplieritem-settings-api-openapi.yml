openapi: 3.2.0
info:
  title: Ptc SupplierItem Settings API
  version: '1.0'
  contact:
    email: arena-support@ptc.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://www.arenasolutions.com/terms/
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  description: 'Operations tagged SupplierItem Settings across 2 of this provider''s published API definitions: ptc-arena-openapi.json, ptc-arena-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /v1
- url: https://api.arenasolutions.com/v1
  description: Relative /v1 server resolved against api.arenasolutions.com, the host serving this spec
security:
- apiKeyAuth: []
- bearerAuth: []
- oauth2Auth: []
tags:
- name: SupplierItem Settings
  description: Manage settings for supplier items (Attributes, Compliance Requirements).
paths:
  /settings/supplieritems/requirements:
    get:
      tags:
      - SupplierItem Settings
      summary: List compliance requirements for supplier items
      operationId: getSupplierItemRequirements
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierItemRequirementFullResultRep'
    servers:
    - url: /v1
  /settings/supplieritems/requirements/{supplierItemRequirementGuid}:
    get:
      tags:
      - SupplierItem Settings
      summary: Get details of a specific supplier item requirement
      operationId: getSupplierItemRequirement
      parameters:
      - name: supplierItemRequirementGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceVo'
    servers:
    - url: /v1
components:
  schemas:
    ErrorObject:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    SupplierItemRequirementFullResultRep:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ComplianceVo'
        count:
          type: integer
          format: int32
      xml:
        name: results
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorObject'
      xml:
        name: errors
    EvidenceLocationVo:
      type: object
      properties:
        allFileCategories:
          type: boolean
        fileCategories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryMinimalVo'
    CategoryMinimalVo:
      type: object
      properties:
        guid:
          type: string
        name:
          type: string
    ComplianceVo:
      type: object
      properties:
        defaultEvidenceType:
          type: string
          enum:
          - NONE
          - DIRECT_FILES
          - AML_AND_FILES
        evidenceLocation:
          $ref: '#/components/schemas/EvidenceLocationVo'
        guid:
          type: string
        invalidationRule:
          type: string
        name:
          type: string
        propagate:
          type: boolean
        rationaleHint:
          type: string
        statementOfRequirement:
          type: string
        type:
          type: string
          enum:
          - ADMIN_DEFINED
          - ARENA_DEFINED
        enabled:
          type: boolean
  securitySchemes:
    oauth2Auth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://openauth.web.prod.bom.com:4431
          scopes: {}
    apiKeyAuth:
      type: apiKey
      name: arena_session_id
      in: header
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-refined-from:
- ptc-arena-openapi.json
- ptc-arena-openapi.yml
