openapi: 3.2.0
info:
  title: Ptc Change Implementation Task API
  version: '1.0'
  contact:
    email: arena-support@ptc.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://www.arenasolutions.com/terms/
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  description: 'Operations tagged Change Implementation Task across 2 of this provider''s published API definitions: ptc-arena-openapi.json, ptc-arena-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /v1
- url: https://api.arenasolutions.com/v1
  description: Relative /v1 server resolved against api.arenasolutions.com, the host serving this spec
security:
- apiKeyAuth: []
- bearerAuth: []
- oauth2Auth: []
tags:
- name: Change Implementation Task
  description: 'Manage implementation tasks for a change: create, update, delete, get (including notes and files).'
paths:
  /changes/{changeGuid}/implementationtasks/{implementationTasksGuid}:
    put:
      tags:
      - Change Implementation Task
      summary: Update an existing implementation task
      description: Edits an implementation task for a specific change. Note that Implementation Task Management and Object Level Override must be enabled for the category. If it is not enabled, the endpoints shall return an error indicating it is not enabled. Not supported for Canceled, Completed or Uncategorized changes. User must be a change administrator, creator of the change, or the current task assginee to perform this endpoint.
      operationId: updateChangeImplementationTask
      parameters:
      - name: changeGuid
        in: path
        required: true
        schema:
          type: string
      - name: implementationTasksGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeImplementationTaskUpdateVo'
            example:
              name: Check New User
              assignee:
                user:
                  guid: 8QAT748AL2J2L4N6804O
              dueDate: '2025-03-08T08:00:00Z'
              status: IN_PROGRESS
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeImplementationTaskVo'
    delete:
      tags:
      - Change Implementation Task
      summary: Delete an implementation task from a change
      description: Deletes a Change Implementation Task from a Change. Implementation Task Management and Object Level Override should be enabled. Change status cannot be canceled or completed. Endpoint can only be performed by the change administrator or the change creator.
      operationId: deleteChangeImplementationTask
      parameters:
      - name: changeGuid
        in: path
        required: true
        schema:
          type: string
      - name: implementationTasksGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: Delete Change Implementation Task Result
          content:
            '*/*':
              schema:
                type: string
    servers:
    - url: /v1
  /changes/{changeGuid}/implementationtasks/{implementationTasksGuid}/notes/{noteGuid}:
    put:
      tags:
      - Change Implementation Task
      summary: Update a note on an implementation task
      description: Edits an implementation task note for an implementation task. Implementation Task Management must be enabled to execute this endpoint. Not supported for Canceled or Completed Changes.
      operationId: updateChangeImplementationTaskNote
      parameters:
      - name: changeGuid
        in: path
        required: true
        schema:
          type: string
      - name: implementationTasksGuid
        in: path
        required: true
        schema:
          type: string
      - name: noteGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImplementationNoteCreateVo'
            example:
              note: This was done late to cost more.
              private: true
              label: Cost Impact
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeImplementationNoteVo'
    delete:
      tags:
      - Change Implementation Task
      summary: Delete a note from an implementation task
      description: Deletes a specific note from a specific implementation task within a Change. Implementation Task Management needs to be enabled for this change category. Not supported for Canceled or Completed changes.
      operationId: deleteChangeImplementationTaskNote
      parameters:
      - name: changeGuid
        in: path
        required: true
        schema:
          type: string
      - name: implementationTasksGuid
        in: path
        required: true
        schema:
          type: string
      - name: noteGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: Delete Change Implementation Task Note Result
          content:
            '*/*':
              schema:
                type: string
    servers:
    - url: /v1
  /changes/{changeGuid}/implementationtasks:
    get:
      tags:
      - Change Implementation Task
      summary: List all implementation tasks for a change
      description: Returns the implementation tasks for a specific change category. Note that Implementation Task Management must be enabled for the category. If it is not enabled, the endpoints shall return an error indicating it is not enabled.
      operationId: getChangeImplementationTasks
      parameters:
      - name: changeGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeImplementationTaskVoResultRep'
    post:
      tags:
      - Change Implementation Task
      summary: Create a new implementation task for a change
      description: Creates an implementation tasks for a specific change. Note that Implementation Task Management and Object Level Override must be enabled for the category. If it is not enabled, the endpoints shall return an error indicating it is not enabled. Not supported for Canceled, Completed or Uncategorized changes.
      operationId: createChangeImplementationTask
      parameters:
      - name: changeGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeImplementationTaskCreateVo'
            examples:
              User:
                description: User
                value:
                  name: Check User
                  assignee:
                    user:
                      guid: 5N7Q4157IZGZI1K33VOE
                  dueDate: '2025-03-07T08:00:00Z'
              User Group:
                description: User Group
                value:
                  name: Check User Group
                  assignee:
                    userGroup:
                      guid: VDXGURVX8OUH0J2L4HEJ
                  dueDate: '2025-03-07T08:00:00Z'
              Supplier:
                description: Supplier
                value:
                  name: Check Supplier
                  assignee:
                    supplier:
                      guid: GYI1FCGITATZI16WZRN2
                  dueDate: '2025-03-07T08:00:00Z'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeImplementationTaskVo'
    servers:
    - url: /v1
  /changes/{changeGuid}/implementationtasks/{implementationTaskGuid}/notes:
    get:
      tags:
      - Change Implementation Task
      summary: List all notes for a specific implementation task
      description: Returns the notes in a specific implementation task within a specific change. Only supported in categories that have Implementation Task Management enabled.
      operationId: getChangeImplementationTaskNotes
      parameters:
      - name: changeGuid
        in: path
        required: true
        schema:
          type: string
      - name: implementationTaskGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeImplementationNoteVoResultRep'
    post:
      tags:
      - Change Implementation Task
      summary: Add a new note to an implementation task
      description: Adds a note to a change implementation task. Implementation Task Management must be enabled to execute this endpoint. Not supported for Canceled or Completed Changes.
      operationId: createChangeImplementationTaskNote
      parameters:
      - name: changeGuid
        in: path
        required: true
        schema:
          type: string
      - name: implementationTaskGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImplementationNoteCreateVo'
            example:
              note: This was done early to improve cost.
              private: false
              label: Cost Impact
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeImplementationNoteVo'
    servers:
    - url: /v1
  /changes/{changeGuid}/implementationtasks/{implementationTaskGuid}/files:
    get:
      tags:
      - Change Implementation Task
      summary: List all files attached to an implementation task
      description: Retrieves the files associated with a change implementation task. Implementation Task Management must be enabled within the specific change category.
      operationId: getImplementationTaskFiles
      parameters:
      - name: changeGuid
        in: path
        required: true
        schema:
          type: string
      - name: implementationTaskGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
