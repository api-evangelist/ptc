        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileAssociationVoResultRep'
    post:
      tags:
      - Change Implementation Task
      summary: Attach a new file to an implementation task
      description: Adds a specific, already existing in the workspace, File to a specific implementation task. Implementation Task Management must be enabled to execute this endpoint. Not supported for Canceled or Completed Changes.
      operationId: createChangeImplementationTaskFile
      parameters:
      - name: changeGuid
        in: path
        required: true
        schema:
          type: string
      - name: implementationTaskGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileAssociationCreateVo'
            example:
              file:
                guid: 8QAT748AL2L1K3SBF661
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileAssociationVo'
    servers:
    - url: /v1
  /changes/{changeGuid}/implementationtasks/{implementationTaskGuid}:
