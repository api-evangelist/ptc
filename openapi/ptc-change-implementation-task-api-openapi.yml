  /changes/{changeGuid}/implementationtasks/{implementationTaskGuid}/notes/{implementationTaskNoteGuid}:
    get:
      tags:
      - Change Implementation Task
      summary: Get details of a specific note on an implementation task
      description: Returns a specific note in a specific implementation task of a specific change. Only supported in categories that have Implementation Task Management enabled.
      operationId: getChangeImplementationTaskNote
      parameters:
      - name: changeGuid
        in: path
        required: true
        schema:
          type: string
      - name: implementationTaskGuid
        in: path
        required: true
        schema:
          type: string
      - name: implementationTaskNoteGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
