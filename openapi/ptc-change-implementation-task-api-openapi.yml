                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeImplementationNoteVo'
    servers:
    - url: /v1
