openapi: 3.2.0
info:
  title: Ptc Requirement API
  version: '1.0'
  contact:
    email: arena-support@ptc.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://www.arenasolutions.com/terms/
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  description: 'Operations tagged Requirement across 2 of this provider''s published API definitions: ptc-arena-openapi.json, ptc-arena-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /v1
- url: https://api.arenasolutions.com/v1
  description: Relative /v1 server resolved against api.arenasolutions.com, the host serving this spec
security:
- apiKeyAuth: []
- bearerAuth: []
- oauth2Auth: []
tags:
- name: Requirement
  description: 'Manage requirements: search, create, update, delete, and get details.'
paths:
  /requirements/{requirementGuid}:
    get:
      tags:
      - Requirement
      summary: Get details of a specific requirement
      description: Returns a Requirement object with a given GUID.
      operationId: getRequirementById
      parameters:
      - name: requirementGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementVo'
    put:
      tags:
      - Requirement
      summary: Update an existing requirement
      description: Updates a Requirement object with a given GUID using the provided data.
      operationId: updateRequirement
      parameters:
      - name: requirementGuid
        in: path
        required: true
        schema:
          type: string
      - name: setnull
        in: query
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementUpdateVo'
            examples:
              example:
                description: example
                value:
                  title: Updated authentication requirement
                  description: Updated description with more detail.
                  assignee:
                    guid: WKSP0000000000000002
                  priority: MEDIUM
                  additionalAttributes:
                  - guid: WKSP0000000000000003
                    value: updated value
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementVo'
    delete:
      tags:
      - Requirement
      summary: Delete a requirement
      description: Deletes a Requirement object with a given GUID.
      operationId: deleteRequirement
      parameters:
      - name: requirementGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: Requirement successfully deleted
    servers:
    - url: /v1
  /requirements/{requirementGuid}/trace/{traceLinkGuid}:
    get:
      tags:
      - Requirement
      summary: Get a specific requirement trace by trace link GUID
      description: Returns a specific requirement trace for a Requirement object with a given GUID and trace link GUID.
      operationId: getTraceByTraceLinkGuid
      parameters:
      - name: requirementGuid
        in: path
        required: true
        schema:
          type: string
      - name: traceLinkGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementTraceVo'
    put:
      tags:
      - Requirement
      summary: Update an existing trace link
      description: Updates properties of an existing trace link between requirements.
      operationId: updateTrace
      parameters:
      - name: requirementGuid
        in: path
        required: true
        schema:
          type: string
      - name: traceLinkGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TraceUpdateVo'
            examples:
              example:
                description: example
                value:
                  relationshipType:
                    guid: WKSP0000000000000010
                  suspected: false
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementTraceVo'
    delete:
      tags:
      - Requirement
      summary: Delete a trace link
      description: Removes a trace link between a requirement and another requirement or item.
      operationId: deleteTrace
      parameters:
      - name: requirementGuid
        in: path
        required: true
        schema:
          type: string
      - name: traceLinkGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: Trace link successfully deleted
    servers:
    - url: /v1
  /requirements:
    get:
      tags:
      - Requirement
      summary: Search for requirements using filters like number, title, or status
      description: Returns a collection of Requirement objects matching the given search criteria.
      operationId: getRequirements
      parameters:
      - name: number
        in: query
        description: requirement number
        schema:
          type: string
      - name: title
        in: query
        description: requirement title
        schema:
          type: string
      - name: status
        in: query
        description: status
        schema:
          type: string
      - name: assignee.fullName
        in: query
        description: assignee.fullName
        schema:
          type: string
      - name: assignee.guid
        in: query
        description: assignee.guid
        schema:
          type: string
      - name: assignee.email
        in: query
        description: assignee.email
        schema:
          type: string
      - name: creator.fullName
        in: query
        description: creator.fullName
        schema:
          type: string
      - name: creator.guid
        in: query
        description: creator.guid
        schema:
          type: string
      - name: creator.email
        in: query
        description: creator.email
        schema:
          type: string
      - name: modificationDateTime
        in: query
        description: modificationDateTime
        schema:
          type: string
      - name: priority
        in: query
        description: priority
        schema:
          type: string
      - name: description
        in: query
        description: description
        schema:
          type: string
      - name: any
        in: query
        description: any
        schema:
          type: string
      - name: template.guid
        in: query
        description: template guid
        schema:
          type: string
      - name: offset
        in: query
        description: query result offset (default 0)
        schema:
          type: integer
      - name: limit
        in: query
        description: query result limit (default 20, max 400)
        schema:
          type: integer
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementVoResultRep'
    post:
      tags:
      - Requirement
      summary: Create a new requirement
      description: Creates a new Requirement object with the provided data.
      operationId: createRequirement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementCreateVo'
            examples:
              example:
                description: example
                value:
                  template:
                    guid: WKSP0000000000000001
                  number: REQ-001
                  title: User authentication requirement
                  description: The system shall support OAuth 2.0 login.
                  assignee:
                    guid: WKSP0000000000000002
                  priority: HIGH
                  numberSequencePrefix:
                    value: REQ
                  additionalAttributes:
                  - guid: WKSP0000000000000003
                    value: custom value
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementVo'
    servers:
    - url: /v1
  /requirements/{requirementGuid}/trace:
    get:
      tags:
      - Requirement
      summary: Get requirement traces by direction
      description: Returns a collection of requirement traces (upstream or downstream) for a Requirement object with a given GUID.
      operationId: getTraces
      parameters:
      - name: direction
        in: query
        description: 'Trace direction: ''Upstream'' or ''Downstream'' (default: ''Downstream'')'
        required: false
        schema:
          type: string
          default: Downstream
          enum:
          - Upstream
          - Downstream
      - name: suspect
        in: query
        description: 'Filter by suspect status: when true, only return traces where suspected=true'
        required: false
        schema:
          type: boolean
      - name: requirementGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementTraceVoResultRep'
    post:
      tags:
      - Requirement
      summary: Add a new trace to a requirement
      description: Creates a new trace link between a requirement and another requirement or item.
      operationId: addTrace
      parameters:
      - name: requirementGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementTraceCreateVo'
            examples:
              example:
                description: example
                value:
                  direction: DOWNSTREAM
                  objectType: REQUIREMENT
                  requirement:
                    guid: WKSP0000000000000009
                  relationshipType:
                    guid: WKSP0000000000000010
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementTraceVo'
    servers:
    - url: /v1
  /requirements/{requirementGuid}/tickets:
    get:
      tags:
      - Requirement
      summary: List all tickets referenced by this requirement
      description: Returns a collection of tickets added as references to a requirement object.
      operationId: getRequirementTickets
      parameters:
      - name: requirementGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemTicketVoResultRep'
    post:
      tags:
      - Requirement
      summary: Link a ticket to a requirement
      description: Adds a ticket as a reference to a requirement.
      operationId: createRequirementTicket
      parameters:
      - name: requirementGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenceVerifyEntity'
            examples:
              example:
                description: example
                value:
                  ticket:
                    guid: WKSP0000000000000008
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceVerifyRep'
    servers:
    - url: /v1
  /requirements/{requirementGuid}/quality:
    get:
      tags:
      - Requirement
      summary: List all quality processes linked to a requirement
      description: Returns a collection of quality processes added as references to a requirement object.
      operationId: getRequirementQuality
      parameters:
      - name: requirementGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferencedQualityVoResultRep'
    post:
      tags:
      - Requirement
      summary: Link a quality process to a requirement
      description: Adds a quality process as a reference to a requirement.
      operationId: createRequirementQuality
      parameters:
      - name: requirementGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenceQualityEntity'
            examples:
              example:
                description: example
                value:
                  quality:
                    guid: WKSP0000000000000006
                    step:
                      guid: WKSP0000000000000007
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceQualityRep'
    servers:
    - url: /v1
  /requirements/{requirementGuid}/files:
    get:
      tags:
      - Requirement
      summary: Get all file associations for a requirement
      description: Returns all file associations for a Requirement object with a given GUID.
      operationId: getRequirementFileAssociations
      parameters:
      - name: requirementGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementFileAssociationVoQueryRep'
    post:
      tags:
      - Requirement
      summary: Attach a file to a requirement
      description: Attaches a file to a Requirement object with a given GUID.
      operationId: attachFileToRequirement
      parameters:
      - name: requirementGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileAssociationCreateVo'
            examples:
              example:
                description: example
                value:
                  file:
                    guid: WKSP0000000000000004
                  latestEditionAssociation: true
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileAssociationVo'
    servers:
    - url: /v1
  /requirements/{requirementGuid}/children:
    get:
      tags:
      - Requirement
      summary: Get child requirements for a requirement
      description: Returns all child requirements for a Requirement object with a given GUID. View type can be 'tree' (hierarchical) or 'list' (flat).
      operationId: getChildRequirements
      parameters:
      - name: view
        in: query
        description: 'View type: ''tree'' for hierarchical view or ''list'' for flat view (default: tree)'
        required: false
        schema:
          type: string
          default: tree
          enum:
          - tree
          - list
      - name: requirementGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementVoResultRep'
    post:
      tags:
      - Requirement
      summary: Add child requirements to a requirement
      description: Adds one or more child requirements to a Requirement object with a given GUID.
      operationId: addChildRequirements
      parameters:
      - name: requirementGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddRequirementCreateVo'
            examples:
              example:
                description: example
                value:
                  requirement:
                    guid: WKSP0000000000000005
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementVoResultRep'
    servers:
    - url: /v1
  /requirements/statuschanges:
    post:
      tags:
      - Requirement
      summary: Change the status of a requirement
      description: Changes the status of a Requirement object.
      operationId: changeRequirementStatus
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementStatusChangeVo'
            examples:
              example:
                description: example
                value:
                  requirement:
                    guid: WKSP0000000000000001
                  status: IN_PROGRESS
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementVo'
    servers:
    - url: /v1
  /requirements/{requirementGuid}/tickets/{associationGuid}:
    get:
      tags:
      - Requirement
      summary: Get details of a specific ticket referenced by this requirement
      operationId: getRequirementTicketByGuid
      parameters:
      - name: requirementGuid
        in: path
        required: true
        schema:
          type: string
      - name: associationGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemToTicketVo'
    delete:
      tags:
      - Requirement
      summary: Unlink a ticket from a requirement
      description: Removes a ticket reference from a requirement with a specific GUID.
      operationId: deleteRequirementTicket
      parameters:
      - name: requirementGuid
        in: path
        required: true
        schema:
          type: string
      - name: associationGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: Ticket successfully unlinked
    servers:
    - url: /v1
  /requirements/{requirementGuid}/quality/{associationGuid}:
    get:
      tags:
      - Requirement
      summary: Get details of a specific quality process linked to a requirement
      operationId: getRequirementQualityByGuid
      parameters:
      - name: requirementGuid
        in: path
        required: true
        schema:
          type: string
      - name: associationGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferencedQualityVo'
    delete:
      tags:
      - Requirement
      summary: Unlink a quality process from a requirement
      description: Removes a quality process reference from a requirement with a specific GUID.
      operationId: deleteRequirementQuality
      parameters:
      - name: requirementGuid
        in: path
        required: true
        schema:
          type: string
      - name: associationGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: Quality process successfully unlinked
    servers:
    - url: /v1
  /requirements/{requirementGuid}/parent:
    get:
      tags:
      - Requirement
      summary: Get parent requirements for a requirement
      description: Returns all parent requirements for a Requirement object with a given GUID.
      operationId: getParentRequirements
      parameters:
      - name: requirementGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementVoResultRep'
    servers:
    - url: /v1
  /requirements/{requirementGuid}/history:
    get:
      tags:
      - Requirement
      summary: Get change history for a requirement
      description: Returns the complete change history for a Requirement object with a given GUID.
      operationId: getRequirementHistory
      parameters:
      - name: requirementGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
