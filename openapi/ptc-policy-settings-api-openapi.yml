openapi: 3.2.0
info:
  title: Ptc Policy Settings API
  version: '1.0'
  contact:
    email: arena-support@ptc.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://www.arenasolutions.com/terms/
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  description: 'Operations tagged Policy Settings across 2 of this provider''s published API definitions: ptc-arena-openapi.json, ptc-arena-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /v1
- url: https://api.arenasolutions.com/v1
  description: Relative /v1 server resolved against api.arenasolutions.com, the host serving this spec
security:
- apiKeyAuth: []
- bearerAuth: []
- oauth2Auth: []
tags:
- name: Policy Settings
  description: Manage users access.
paths:
  /settings/accesspolicies:
    get:
      tags:
      - Policy Settings
      summary: List all access policies
      operationId: getWorkspacePolicies
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponseVoResultRep'
    servers:
    - url: /v1
  /settings/accesspolicies/{policyGuid}:
    get:
      tags:
      - Policy Settings
      summary: Get details of a specific access policy
      operationId: getPolicy
      parameters:
      - name: policyGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponseVo'
    servers:
    - url: /v1
  /settings/accesspolicies/{policyGuid}/users:
    get:
      tags:
      - Policy Settings
      summary: List users linked to an access policy
      operationId: getUsersInPolicy
      parameters:
      - name: policyGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantedUserVoResultRep'
    servers:
    - url: /v1
  /settings/accesspolicies/{policyGuid}/users/{grantGuid}:
    get:
      tags:
      - Policy Settings
      summary: Get details of a specific user linked to a policy
      operationId: getUserInPolicy
      parameters:
      - name: policyGuid
        in: path
        required: true
        schema:
          type: string
      - name: grantGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantedUserVo'
    servers:
    - url: /v1
  /settings/accesspolicies/{policyGuid}/usergroups:
    get:
      tags:
      - Policy Settings
      summary: List user groups linked to an access policy
      operationId: getUserGroupsInPolicy
      parameters:
      - name: policyGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantedUserGroupVoResultRep'
    servers:
    - url: /v1
  /settings/accesspolicies/{policyGuid}/usergroups/{grantGuid}:
    get:
      tags:
      - Policy Settings
      summary: Get details of a specific group linked to a policy
      operationId: getUserGroupInPolicy
      parameters:
      - name: policyGuid
        in: path
        required: true
        schema:
          type: string
      - name: grantGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantedUserGroupVo'
    servers:
    - url: /v1
