openapi: 3.2.0
info:
  title: Ptc Outbound Integration API
  version: '1.0'
  contact:
    email: arena-support@ptc.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://www.arenasolutions.com/terms/
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  description: 'Operations tagged Outbound Integration across 2 of this provider''s published API definitions: ptc-arena-openapi.json, ptc-arena-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /v1
- url: https://api.arenasolutions.com/v1
  description: Relative /v1 server resolved against api.arenasolutions.com, the host serving this spec
security:
- apiKeyAuth: []
- bearerAuth: []
- oauth2Auth: []
tags:
- name: Outbound Integration
  description: Access and manage outbound integration definitions and administrators.
paths:
  /outboundintegrations/{integrationGuid}/events/{eventGuid}:
    get:
      tags:
      - Outbound Integration
      summary: Get details of a specific event in an integration
      description: Returns an Event object matching the GUID.
      operationId: getEvent
      parameters:
      - name: integrationGuid
        in: path
        required: true
        schema:
          type: string
      - name: eventGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ChangeEventDetailVo'
                - $ref: '#/components/schemas/ItemBasedEventDetailVo'
    put:
      tags:
      - Outbound Integration
      summary: Update the reconciliation status of an integration event
      description: 'Updates the reconciliation status for all Items in an event with a given GUID.


        Security: User must be an integration administrator.

        If the event''s itemsReconciled property is already set to the desired value, the response code will be 200 and no action will be performed.'
      operationId: updateIntegrationEventReconciled
      parameters:
      - name: integrationGuid
        in: path
        required: true
        schema:
          type: string
      - name: eventGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemBasedEventDetail'
            example:
              itemsReconciled: true
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemBasedEventDetailVo'
    servers:
    - url: /v1
  /outboundintegrations/{integrationGuid}/events/{eventGuid}/items/{eventItemGuid}:
    get:
      tags:
      - Outbound Integration
      summary: Get details of a specific item in an integration event
      description: Returns an Item from an integration event with a given GUID.
      operationId: getEventItem
      parameters:
      - name: integrationGuid
        in: path
        required: true
        schema:
          type: string
      - name: eventGuid
        in: path
        required: true
        schema:
          type: string
      - name: eventItemGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventItemRep'
    put:
      tags:
      - Outbound Integration
      summary: Update the reconciliation status of a specific event item
      description: 'Updates the reconciliation status for a specific event Item with a GUID in an event with a given GUID.


        Security: User must be an integration administrator.

        If the item''s Reconciled property is already set to the desired value, the response code will be 200 and no action will be performed.

        Changing the event item reconciled property may change the event''s itemsReconciled property.'
      operationId: updateEventItemReconciled
      parameters:
      - name: integrationGuid
        in: path
        required: true
        schema:
          type: string
      - name: eventGuid
        in: path
        required: true
        schema:
          type: string
      - name: eventItemGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconciledVo'
            example:
              reconciled: true
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventItemRep'
    servers:
    - url: /v1
  /outboundintegrations:
    get:
      tags:
      - Outbound Integration
      summary: Search for outbound integrations using filters like name or status
      description: Returns a collection of outbound integrations objects matching the given search criteria.
      operationId: getIntegrations
      parameters:
      - name: name
        in: query
        schema:
          type: string
      - name: enabled
        in: query
        schema:
          type: boolean
      - name: offset
        in: query
        description: query result offset (default 0)
        schema:
          type: integer
      - name: limit
        in: query
        description: query result limit (default 20, max 400)
        schema:
          type: integer
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationShortRepResult'
    servers:
    - url: /v1
  /outboundintegrations/{integrationGuid}:
    get:
      tags:
      - Outbound Integration
      summary: Get details of a specific outbound integration
      description: Returns a specific outbound integrations object matching the given GUID.
      operationId: getIntegration
      parameters:
      - name: integrationGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationFullVo'
    servers:
    - url: /v1
  /outboundintegrations/{integrationGuid}/filters:
    get:
      tags:
      - Outbound Integration
      summary: Get filter settings for a specific integration
      operationId: getIntegrationFilters
      parameters:
      - name: integrationGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterVo'
    servers:
    - url: /v1
  /outboundintegrations/{integrationGuid}/events:
    get:
      tags:
      - Outbound Integration
      summary: List all events associated with a specific integration
      description: Returns unreconciled event objects matching the given search criteria.
      operationId: getEventAssociations
      parameters:
      - name: integrationGuid
        in: path
        required: true
        schema:
          type: string
      - name: itemsReconciled
        in: query
        required: false
        schema:
          type: string
      - name: creationDateTimeFrom
        in: query
        required: false
        schema:
          type: string
      - name: creationDateTimeTo
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ChangeBasedEventVoResultRep'
                - $ref: '#/components/schemas/ItemBasedEventVoResultRep'
    servers:
    - url: /v1
  /outboundintegrations/{integrationGuid}/events/{eventGuid}/items:
    get:
      tags:
      - Outbound Integration
      summary: List all items associated with a specific integration event
      description: Returns items of an outbound integrations matching the given search criteria.
      operationId: getEventItems
      parameters:
      - name: integrationGuid
        in: path
        required: true
        schema:
          type: string
      - name: eventGuid
        in: path
        required: true
        schema:
          type: string
      - name: reconciled
        in: query
        required: false
        schema:
          type: string
      - name: reconciledDateTimeFrom
        in: query
        required: false
        schema:
          type: string
      - name: reconciledDateTimeTo
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventItemRepResult'
    servers:
    - url: /v1
  /outboundintegrations/{integrationGuid}/events/{eventGuid}/itemguids:
    get:
      tags:
      - Outbound Integration
      summary: Get GUIDs of items associated with a specific integration event
      description: Returns a list of Item revision GUIDs from an integration event.
      operationId: getEventItemGuids
      parameters:
      - name: integrationGuid
        in: path
        required: true
        schema:
          type: string
      - name: eventGuid
        in: path
        required: true
        schema:
          type: string
      - name: reconciled
        in: query
        required: false
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResultRep'
    servers:
    - url: /v1
  /outboundintegrations/{integrationGuid}/administrators:
    get:
      tags:
      - Outbound Integration
      summary: List administrators assigned to a specific integration
      description: Returns all the integration administrators of a specific outbound integrations objects matching the given GUID.
      operationId: getIntegrationAdministrators
      parameters:
      - name: integrationGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCompactVoResultRep'
    servers:
    - url: /v1
