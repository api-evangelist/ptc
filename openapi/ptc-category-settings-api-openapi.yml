openapi: 3.2.0
info:
  title: Ptc Category Settings API
  version: '1.0'
  contact:
    email: arena-support@ptc.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://www.arenasolutions.com/terms/
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  description: 'Operations tagged Category Settings across 2 of this provider''s published API definitions: ptc-arena-openapi.json, ptc-arena-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /v1
- url: https://api.arenasolutions.com/v1
  description: Relative /v1 server resolved against api.arenasolutions.com, the host serving this spec
security:
- apiKeyAuth: []
- bearerAuth: []
- oauth2Auth: []
tags:
- name: Category Settings
  description: Manage settings for categories across various objects (Item, File, Request, Change).
paths:
  /settings/{objectType}/categories:
    get:
      tags:
      - Category Settings
      summary: List all categories for a given object type
      description: List all categories for a given object type. Supports Item, Change, and Request objects.
      operationId: getCategories
      parameters:
      - name: objectType
        in: path
        required: true
        schema:
          type: string
          enum:
          - items
          - files
          - changes
          - requests
      - name: path
        in: query
        required: false
        schema:
          type: string
      - name: includeDeleted
        in: query
        required: false
        schema:
          type: boolean
      - name: assignable
        in: query
        required: false
        schema:
          type: boolean
      - name: user
        in: query
        required: false
        schema:
          type: string
      - name: action
        in: query
        required: false
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ChangeCategoryResultRep'
                - $ref: '#/components/schemas/CategoryFullResultRep'
                - $ref: '#/components/schemas/RequestCategoryResultRep'
    servers:
    - url: /v1
  /settings/{objectType}/categories/{categoryGuid}:
    get:
      tags:
      - Category Settings
      summary: Get details of a specific category
      description: Get details of a specific category. Supports Item, File, Change and Request objects.
      operationId: getCategory
      parameters:
      - name: objectType
        in: path
        required: true
        schema:
          type: string
          enum:
          - items
          - files
          - changes
          - requests
      - name: categoryGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ChangeCategoryVo'
                - $ref: '#/components/schemas/CategoryVo'
                - $ref: '#/components/schemas/RequestCategoryVo'
    servers:
    - url: /v1
  /settings/{objectType}/categories/{categoryGuid}/attributes:
    get:
      tags:
      - Category Settings
      summary: List all attributes for a specific category
      description: List all attributes for a specific category. Supports Item, Change, and Request objects.
      operationId: getCategoryAttributesDefinitions
      parameters:
      - name: objectType
        in: path
        required: true
        schema:
          type: string
          enum:
          - items
          - changes
          - requests
      - name: categoryGuid
        in: path
        required: true
        schema:
          type: string
      - name: includePossibleValues
        in: query
        required: false
        schema:
          type: boolean
      - name: creatableOnly
        in: query
        required: false
        schema:
          type: boolean
      - name: editableOnly
        in: query
        required: false
        schema:
          type: boolean
      - name: searchableOnly
        in: query
        required: false
        schema:
          type: boolean
      - name: user
        in: query
        required: false
        schema:
          type: string
      - name: action
        in: query
        required: false
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAttributeDefinitionResultRep'
    servers:
    - url: /v1
  /settings/{objectType}/categories/{categoryGuid}/attributes/{attributeDefinitionGuid}:
    get:
      tags:
      - Category Settings
      summary: Get details of a specific attribute in a category
      description: Get details of a specific attribute in a categor. Supports Item, Change, and Request objects.
      operationId: getCategoryAttributeDefinition
      parameters:
      - name: objectType
        in: path
        required: true
        schema:
          type: string
          enum:
          - items
          - changes
          - requests
      - name: categoryGuid
        in: path
        required: true
        schema:
          type: string
      - name: attributeDefinitionGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAttributeDefinitionVo'
    servers:
    - url: /v1
  /settings/changes/categories/{categoryGuid}/items/attributes:
    get:
      tags:
      - Category Settings
      summary: List item attributes for a change category
      operationId: getChangeCategoryItemAttributes
      parameters:
      - name: categoryGuid
        in: path
        required: true
        schema:
          type: string
      - name: includePossibleValues
        in: query
        required: false
        schema:
          type: boolean
      - name: creatableOnly
        in: query
        required: false
        schema:
          type: boolean
      - name: editableOnly
        in: query
        required: false
        schema:
          type: boolean
      - name: searchableOnly
        in: query
        required: false
        schema:
          type: boolean
      - name: includeDeleted
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeDefinitionFullRepResultRep'
    servers:
    - url: /v1
