        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/QueryResultRepGrantedPolicyVo'
    post:
      tags:
      - User Settings
      summary: Assign an access policy to a partner
      operationId: assignPolicyToPartners
      parameters:
      - name: employeeGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyAssignRequestVo'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GrantedPolicyVo'
    servers:
    - url: /v1
  /settings/users/machines:
    get:
      tags:
      - User Settings
      summary: List all machine users in the workspace
      operationId: getWorkspaceMachineUsers
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/QueryResultRepMachineUserAccessVo'
    post:
      tags:
