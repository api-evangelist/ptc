          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/QueryResultRepWorkspaceEmployeeAccessVo'
    post:
      tags:
      - User Settings
      summary: Add an employee to the workspace
      description: 'Adds an existing Employee User to the workspace that the API user is currently logged into.


        accountUser.guid or accountUser.email is required. If both are included, they must match the same account.'
