openapi: 3.2.0
info:
  title: Ptc User Settings API
  version: '1.0'
  contact:
    email: arena-support@ptc.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://www.arenasolutions.com/terms/
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  description: 'Operations tagged User Settings across 2 of this provider''s published API definitions: ptc-arena-openapi.json, ptc-arena-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /v1
- url: https://api.arenasolutions.com/v1
  description: Relative /v1 server resolved against api.arenasolutions.com, the host serving this spec
security:
- apiKeyAuth: []
- bearerAuth: []
- oauth2Auth: []
tags:
- name: User Settings
  description: Manage users (via GET Users).
paths:
  /settings/users/partners/{partnerGuid}:
    get:
      tags:
      - User Settings
      summary: Get details of a specific partner user
      operationId: getPartner
      parameters:
      - name: partnerGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PartnerInfoVo'
    put:
      tags:
      - User Settings
      summary: Update license settings for a partner user
      operationId: updatePartnerLicense
      parameters:
      - name: partnerGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceEmployeeUpdateVo'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PartnerInfoVo'
    delete:
      tags:
      - User Settings
      summary: Remove a partner user from the workspace
      operationId: removePartnerLicense
      parameters:
      - name: partnerGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: No Content
    servers:
    - url: /v1
  /settings/users/machines/{machineUserGuid}:
    put:
      tags:
      - User Settings
      summary: Update license settings for a machine user
      operationId: updateMachineLicense
      parameters:
      - name: machineUserGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceEmployeeUpdateVo'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MachineUserAccessVo'
    delete:
      tags:
      - User Settings
      summary: Remove a machine user from the workspace
      operationId: removeMachineUser
      parameters:
      - name: machineUserGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: No Content
    servers:
    - url: /v1
  /settings/users/employees/{employeeGuid}:
    get:
      tags:
      - User Settings
      summary: Get details of a specific workspace employee
      description: Gets details on Employee Users in the workspace that the current API user is logged into.
      operationId: getAccountEmployeeDeprecated
      parameters:
      - name: employeeGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/WorkspaceEmployeeAccessVo'
    put:
      tags:
      - User Settings
      summary: Update license settings for a workspace employee
      operationId: updateLicence
      parameters:
      - name: employeeGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceEmployeeUpdateVo'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/WorkspaceEmployeeAccessVo'
    delete:
      tags:
      - User Settings
      summary: Remove an employee from the workspace
      operationId: removeAccess
      parameters:
      - name: employeeGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: No Content
          content:
            '*/*':
              schema:
                type: string
    servers:
    - url: /v1
  /settings/accountusers/machines/{machineUserGuid}:
    get:
      tags:
      - User Settings
      summary: Get details of a specific machine user
      operationId: getAccountMachineUser
      parameters:
      - name: machineUserGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMachineUserVo'
    put:
      tags:
      - User Settings
      summary: Update the details of a machine user
      description: 'Updates the metadata of a Machine User with a given GUID.


        This endpoint does not support setting the password or token for Machine Users. POST sets the password automatically to a secure random string and does not set the token. Passwords can be set by the user manually in the UI.

        This endpoint does not support the ForIntegrationUse attribute.'
      operationId: updateAccountMachineUser
      parameters:
      - name: setnull
        in: query
        schema:
          type: boolean
      - name: machineUserGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountMachineUserUpdateVo'
            example:
              email: build-bot@example.com
              enabled: true
              name: build-bot
              owner:
                guid: L3N6KHLNYFVBUDR505J3
              isAdministrator: false
              applicationLanguage: English (United States)
              loginConflictResolution: TERMINATE_EXISTING_SESSION
              notes: Service account for CI/CD tasks.
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMachineUserVo'
    servers:
    - url: /v1
  /settings/accountusers/employees/{employeeGuid}:
    get:
      tags:
      - User Settings
      summary: Get detailed information about a specific employee
      description: Users are managed in Arena at the account level. Users can then belong to 0 or more workspaces that are associated with the account.
      operationId: getAccountEmployee
      parameters:
      - name: employeeGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEmployeeVo'
    put:
      tags:
      - User Settings
      summary: Update the details of a specific employee
      description: 'Updates the metadata of an Employee User with a given GUID.


        Neither twoFactorAuthenticationConfigured nor securityQuestionConfigured can be set using the API.

        If notifyUser is specified and the user has not reset their password, the following error is returned: notifyUser is not editable until the user resets their password.

        This endpoint does not support the ForIntegrationUse attribute.

        There is no response for temporaryPassword and notifyUser.'
      operationId: updateAccountEmployee
      parameters:
      - name: setnull
        in: query
        schema:
          type: boolean
      - name: employeeGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountEmployeeUpdateVo'
            example:
              email: jane.doe@example.com
              enabled: true
              firstName: Jane
              lastName: Doe
              department: Engineering
              location: San Francisco
              title: Senior Software Engineer
              manager: john.manager@example.com
              notes: Promoted in Q3.
              phone: +1-415-555-0123
              mobile: +1-415-555-0456
              fax: +1-415-555-0789
              address:
                address1: 123 Market St
                address2: Suite 400
                city: San Francisco
                state: CALIFORNIA
                country: United States
                province: null
                postalCode: '94103'
              isAdministrator: false
              applicationLanguage: English (United States)
              temporaryPassword: TempPass!234
              notifyUser: true
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEmployeeVo'
    servers:
    - url: /v1
  /settings/users/partners/{employeeGuid}/usergroups:
    get:
      tags:
      - User Settings
      summary: List all user groups assigned to a partner
      operationId: getPartnerUsergroups
      parameters:
      - name: employeeGuid
