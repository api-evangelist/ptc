components:
  schemas:
    MachineUserAccessVo:
      type: object
      properties:
        enabled:
          type: boolean
        guid:
          type: string
        license:
          $ref: '#/components/schemas/LicenseVo'
        accountUser:
          $ref: '#/components/schemas/AccountUserForMachineUserVo'
    PolicyAssignRequestVo:
      type: object
      properties:
        accessPolicy:
          $ref: '#/components/schemas/AccessPolicy'
    PolicyResponseVo:
      type: object
      properties:
        guid:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
    QueryResultRepGrantedPolicyVo:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/GrantedPolicyVo'
        count:
          type: integer
          format: int32
      xml:
        name: results
    AccountUserForMachineUserVo:
      type: object
      properties:
        email:
          type: string
        enabled:
          type: boolean
        name:
          type: string
        guid:
          type: string
        account:
          $ref: '#/components/schemas/AccountVo'
    PartnerInfoVo:
      type: object
      properties:
        enabled:
          type: boolean
        guid:
          type: string
        license:
          $ref: '#/components/schemas/LicenseVo'
        accountUser:
          $ref: '#/components/schemas/AccountUserCompactVo'
        status:
          type: string
          enum:
          - ACCEPTED
          - PENDING
          - REJECTED
    GrantedPolicyVo:
      type: object
      properties:
        guid:
          type: string
        accessPolicy:
          $ref: '#/components/schemas/PolicyResponseVo'
    LicenseVo:
      type: object
      properties:
        name:
          type: string
          enum:
          - FULL
          - READ_ONLY
          - APPROVER
          - ADAPTER
          - ADDON_PRODUCT_ONLY
        training:
          type: boolean
        analytics:
          type: string
          enum:
          - VIEWER
          - EDITOR
          - OTHER
          - DISABLED
    AddressVo:
      type: object
      properties:
        label:
          type: string
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        state:
          type: string
          enum:
          - ALASKA
          - AK
          - ALABAMA
          - AL
          - ARKANSAS
          - AR
          - ARIZONA
          - AZ
          - CALIFORNIA
          - CA
          - COLORADO
          - CO
          - CONNECTICUT
          - CT
          - DISTRICT OF COLUMBIA
          - DC
          - DELAWARE
          - DE
          - FLORIDA
          - FL
          - GEORGIA
          - GA
          - HAWAII
          - HI
          - IOWA
          - IA
          - IDAHO
