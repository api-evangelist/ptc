        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberFormatCompactResultRep'
    post:
      tags:
      - Item Settings
      summary: Create a new item number format
      operationId: createItemNumberFormat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemNumberFormatCreateVo'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberFormatBasicInfoVo'
    servers:
    - url: /v1
  /settings/items/requirements:
    get:
      tags:
      - Item Settings
      summary: List all compliance requirements for items
      operationId: getItemRequirements
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemRequirementFullResultRep'
    servers:
    - url: /v1
  /settings/items/requirements/{itemRequirementGuid}:
    get:
      tags:
      - Item Settings
      summary: Get details of a specific item requirement
      operationId: getItemRequirement
      parameters:
      - name: itemRequirementGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
