          content:
            '*/*':
              schema:
                type: string
    servers:
    - url: /v1
  /settings/items/lifecyclephases:
    get:
      tags:
      - Item Settings
      summary: List all lifecycle phases for items
      operationId: getWorkspaceItemLifecyclePhases
      responses:
