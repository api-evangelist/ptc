        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemNumberFormatFieldDetailResultRep'
    post:
      tags:
      - Item Settings
      summary: Add a new field to a number format
      operationId: createItemNumberFormatField
      parameters:
      - name: formatGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemNumberFormatFieldDetailCreateVo'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberFormatFieldFullVo'
    servers:
    - url: /v1
  /settings/items/numberformats:
    get:
      tags:
      - Item Settings
      summary: List all item number formats
      operationId: getItemNumberFormats
      parameters:
      - name: name
        in: query
        schema:
          type: string
      - name: active
        in: query
        schema:
          type: boolean
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
