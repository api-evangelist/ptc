openapi: 3.2.0
info:
  title: Ptc Item Settings API
  version: '1.0'
  contact:
    email: arena-support@ptc.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://www.arenasolutions.com/terms/
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  description: 'Operations tagged Item Settings across 2 of this provider''s published API definitions: ptc-arena-openapi.json, ptc-arena-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /v1
- url: https://api.arenasolutions.com/v1
  description: Relative /v1 server resolved against api.arenasolutions.com, the host serving this spec
security:
- apiKeyAuth: []
- bearerAuth: []
- oauth2Auth: []
tags:
- name: Item Settings
  description: Manage settings for items (Lifecycle Phases, Attributes, Categories, Number Formats).
paths:
  /settings/items/numberformats/{formatGuid}/fields/{fieldGuid}:
    get:
      tags:
      - Item Settings
      summary: Get details of a specific field in a number format
      operationId: getItemNumberFormatField
      parameters:
      - name: formatGuid
        in: path
        required: true
        schema:
          type: string
      - name: fieldGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberFormatFieldFullVo'
    put:
      tags:
      - Item Settings
      summary: Update a field in a number format
      operationId: updateItemNumberFormatField
      parameters:
      - name: formatGuid
        in: path
        required: true
        schema:
          type: string
      - name: fieldGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemNumberFormatFieldDetailUpdateVo'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberFormatFieldFullVo'
    delete:
      tags:
      - Item Settings
      summary: Remove a field from a number format
      operationId: deleteItemNumberFormatField
      parameters:
      - name: formatGuid
        in: path
        required: true
        schema:
          type: string
      - name: fieldGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: Delete Item Number Format Field Result
          content:
            '*/*':
              schema:
                type: string
    servers:
    - url: /v1
  /settings/items/numberformats/{formatGuid}:
    get:
      tags:
      - Item Settings
      summary: Get details of a specific item number format
      operationId: getItemNumberFormat
      parameters:
      - name: formatGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberFormatFullVo'
    put:
      tags:
      - Item Settings
      summary: Update an existing item number format
      operationId: updateItemNumberFormat
      parameters:
      - name: formatGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemNumberFormatUpdateVo'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberFormatBasicInfoVo'
    delete:
      tags:
      - Item Settings
      summary: Delete an item number format
      operationId: deleteItemNumberFormat
      parameters:
      - name: formatGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: Delete Item Number Format Result
          content:
            '*/*':
              schema:
                type: string
    servers:
    - url: /v1
  /settings/items/numberreservations:
    get:
      tags:
      - Item Settings
      summary: Search for item number reservations using filters
      operationId: getItemNumberReservations
      parameters:
      - name: name
        in: query
        description: Number reservations name
        schema:
          type: string
      - name: category.guid
        in: query
        description: Reserved category
        schema:
          type: string
      - name: includeitemnumbers
        in: query
        description: Include item numbers in the result
        schema:
          type: boolean
          default: true
      - name: offset
        in: query
        description: query result offset (default 0)
        schema:
          type: integer
      - name: limit
        in: query
        description: query result limit (default 20, max 400)
        schema:
          type: integer
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/QueryResultRepNumberReservationVo'
    post:
      tags:
      - Item Settings
      summary: Create a new item number reservation
      operationId: createNumberReservation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NumberReservationCreateVo'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/NumberReservationVo'
    servers:
    - url: /v1
  /settings/items/numberformats/{formatGuid}/fields:
    get:
      tags:
      - Item Settings
      summary: List all fields in an item number format
      operationId: getItemNumberFormatFields
      parameters:
      - name: formatGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
