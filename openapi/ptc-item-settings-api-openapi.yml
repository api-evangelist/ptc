          format: int32
        order:
          type: integer
          format: int32
        possibleValues:
          type: array
          items:
            $ref: '#/components/schemas/NumberFormatPossibleValueCreateVo'
        zeroPadding:
          type: boolean
        value:
          type: string
        type:
          type: string
          enum:
