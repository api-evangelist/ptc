      tags:
      - Item Settings
      summary: Get details of a specific item number reservation
      operationId: getItemNumberReservation
      parameters:
      - name: reservationGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
