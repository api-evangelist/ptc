openapi: 3.2.0
info:
  title: Ptc QualityProcess Settings API
  version: '1.0'
  contact:
    email: arena-support@ptc.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://www.arenasolutions.com/terms/
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  description: 'Operations tagged QualityProcess Settings across 2 of this provider''s published API definitions: ptc-arena-openapi.json, ptc-arena-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /v1
- url: https://api.arenasolutions.com/v1
  description: Relative /v1 server resolved against api.arenasolutions.com, the host serving this spec
security:
- apiKeyAuth: []
- bearerAuth: []
- oauth2Auth: []
tags:
- name: QualityProcess Settings
  description: Manage settings for quality processes (Owners, Number Formats, Templates, Attributes, Step Attributes).
paths:
  /settings/{objectType}/numbersequences:
    get:
      tags:
      - QualityProcess Settings
      summary: List all number sequences for a given type
      description: List all number sequences for a given type. Supports Requests, Changes, Tickets, and Training Plan objects.
      operationId: getNumberSequences
      parameters:
      - name: objectType
        in: path
        required: true
        schema:
          type: string
          enum:
          - qualityprocesses
          - requests
          - changes
          - tickets
          - trainingplans
          - requirements
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberSequenceResultRep'
    servers:
    - url: /v1
  /settings/{objectType}/numbersequences/{guid}:
    get:
      tags:
      - QualityProcess Settings
      summary: Get details of a specific number sequence
      description: Get details of a specific number sequencefor Requests, Changes, Tickets, and Training Plans.
      operationId: getNumberSequence
      parameters:
      - name: objectType
        in: path
        required: true
        schema:
          type: string
          enum:
          - qualityprocesses
          - requests
          - changes
          - tickets
          - trainingplans
          - requirements
      - name: guid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberSequenceCompactVo'
    servers:
    - url: /v1
  /settings/{objectType}/numbersequenceprefixes:
    get:
      tags:
      - QualityProcess Settings
      summary: List all prefixes for number sequences for a given type
      description: List all prefixes for number sequences for a given type. Supports Requests, Changes, Tickets, and Training Plan objects.
      operationId: getNumberSequencePrefixes
      parameters:
      - name: objectType
        in: path
        required: true
        schema:
          type: string
          enum:
          - qualityprocesses
          - requests
          - changes
          - tickets
          - trainingplans
          - requirements
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberSequencePrefixCompactResultRep'
    servers:
    - url: /v1
  /settings/qualityprocesses/templates:
    get:
      tags:
      - QualityProcess Settings
      summary: List all quality process templates
      operationId: getTemplates
      parameters:
      - name: name
        in: query
        schema:
          type: string
      - name: active
        in: query
        schema:
          type: boolean
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityTemplateFullRepResultRep'
    servers:
    - url: /v1
  /settings/qualityprocesses/templates/{qualityprocessTemplateGuid}:
    get:
      tags:
      - QualityProcess Settings
      summary: Get details of a specific quality process template
      operationId: getTemplate
      parameters:
      - name: qualityprocessTemplateGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityTemplateVo'
    servers:
    - url: /v1
  /settings/qualityprocesses/numberformats:
    get:
      tags:
      - QualityProcess Settings
      summary: List number formats for quality processes
      operationId: getQualityProcessNumberFormats
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberSequenceCompactResultRep'
    servers:
    - url: /v1
  /settings/qualityprocesses/numberformats/{guid}:
    get:
      tags:
      - QualityProcess Settings
      summary: Get details of a specific quality number format
      operationId: getQualityProcessNumberFormat
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberSequenceCompactVo'
    servers:
    - url: /v1
components:
  schemas:
    QualityDefaultUsers:
      type: object
      properties:
        userGroups:
          type: array
          items:
            $ref: '#/components/schemas/UserGroupWithUserVo'
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserCompactVo'
    ErrorObject:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    NumberSequenceCompactVo:
      type: object
      properties:
        guid:
          type: string
        lastUsed:
          type: string
        name:
          type: string
        nextValue:
          type: string
        prefixes:
          type: array
          items:
            $ref: '#/components/schemas/NumberFormatPrefixVo'
        creationDateTime:
          type: string
    QualityTemplateStepVo:
      type: object
      properties:
        defaultAssignees:
          $ref: '#/components/schemas/QualityDefaultUsers'
        defaultApprovers:
          $ref: '#/components/schemas/QualityDefaultUsers'
        approvers:
          type: array
          items:
            $ref: '#/components/schemas/UserCompactVo'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeDefinitionVo'
        description:
          type: string
        guid:
          type: string
        name:
          type: string
        order:
          type: integer
          format: int32
        type:
          type: string
        updateAffectedAfterClosure:
          type: boolean
        allowOwnerToAddApprovers:
          type: boolean
    QualityTemplateFullRepResultRep:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/QualityTemplateVo'
        count:
          type: integer
          format: int32
      xml:
        name: results
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorObject'
      xml:
        name: errors
    QualityNumberFormatVo:
      type: object
      properties:
        guid:
          type: string
        lastUsed:
          type: string
        name:
          type: string
        nextValue:
          type: string
        prefixes:
          type: array
          items:
            $ref: '#/components/schemas/NumberFormatPrefixVo'
    SingleGuidVo:
      type: object
      properties:
        guid:
          type: string
    NumberSequenceCompactResultRep:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/NumberSequenceCompactVo'
        count:
          type: integer
          format: int32
      xml:
        name: results
    UserGroupWithUserVo:
      type: object
      properties:
        guid:
          type: string
        name:
          type: string
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserCompactVo'
    UserCompactVo:
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        guid:
          type: string
    NumberSequenceResultRep:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/NumberSequenceCompactVo'
        count:
          type: integer
          format: int32
      xml:
        name: results
    AttributeDefinitionVo:
      type: object
      properties:
        guid:
          type: string
        active:
          type: boolean
        allowLowerCase:
          type: boolean
        allowNegatives:
          type: boolean
        allowUpperCase:
          type: boolean
        allowsExplicitNullValue:
          type: boolean
        creatable:
          type: boolean
        custom:
          type: boolean
        deleted:
          type: boolean
        deprecated:
          type: boolean
        editable:
          type: boolean
        global:
          type: boolean
        apiName:
          type: string
        costCalculation:
          type: string
          enum:
          - ENTERED
          - ROLLUP
          - ROLLUP_AND_ENTERED
        currency:
          type: string
