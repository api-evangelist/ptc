          type: array
          items:
            $ref: '#/components/schemas/QualityTemplateStepVo'
        supplierCreatorSetting:
          type: boolean
        supplierStepAssignSetting:
          type: boolean
        stepSequencing:
          type: string
          enum:
          - NO_SEQUENCING
          - COMPLETE_ONLY
          - COMPLETE_AND_EDIT
