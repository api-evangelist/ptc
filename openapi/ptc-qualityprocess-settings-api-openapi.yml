            - ITEM_SOURCING
            - ITEM_COSTING
            - ITEM_FILES
            - ITEM_COMPLIANCE
            - ITEM_REVISIONS
            - ITEM_NOTIFICATIONS
            - ITEM_SUPPLIER_ACCESS
            - ITEM_PROJECTS
            - ITEM_QUALITY
            - ITEM_CUSTOM
            - ITEM_CUSTOM_NON_REV
            - ITEM_TRAINING
            - ITEM_TRAINING_PLANS
            - ITEM_TRAINING_RECORDS
            - ITEM_TRAINING_QUIZ
            - ITEM_TRAINING_QUIZ_HISTORY
            - ITEM_VERIFY
            - ITEM_REFERENCES
            - REQUEST_SUMMARY
            - REQUEST_FILES
            - REQUEST_ITEMS
            - REQUEST_PARTICIPANTS
            - REQUEST_EVALUATION
            - REQUEST_CHANGES
            - REQUEST_STATUS
            - REQUEST_RECENT_ACTIVITY
            - REQUEST_PROJECTS
            - REQUEST_QUALITY
            - REQUEST_CUSTOM
            - CHANGE_SUMMARY
            - CHANGE_FILES
            - CHANGE_ITEMS
            - CHANGE_REQUESTS
            - CHANGE_APPROVAL_ROUTINGS
            - CHANGE_APPROVAL_DECISIONS
            - CHANGE_IMPLEMENTATION
            - CHANGE_ALERTS
            - CHANGE_NOTIFICATIONS
            - CHANGE_STATUS
            - CHANGE_PROJECTS
            - CHANGE_QUALITY
            - CHANGE_SUPPLIER_ACCESS
            - CHANGE_CUSTOM
            - CHANGE_VERIFY
            - SUPPLIER_PROFILE
            - SUPPLIER_CONTACTS
            - SUPPLIER_SUPPLIER_ITEMS
            - SUPPLIER_SOURCING_LINES
            - SUPPLIER_SOURCED_ITEMS
            - SUPPLIER_FILES
            - SUPPLIER_QUALITY
            - SUPPLIER_CUSTOM
            - SUPPLIER_ITEMS_QUALITY
            - SI_SPECS
            - SI_SOURCING_LINES
            - SI_QUOTES
            - SI_PURCHASES
            - SI_FILES
            - SI_COMPLIANCE
            - SI_LOOKUP
            - SI_CUSTOM
            - FILE_SUMMARY
            - FILE_ASSOCIATIONS
            - FILE_EDITIONS
            - FILE_MARKUPS
            - FILE_RECENT_ACTIVITY
            - FILE_PROJECTS
            - FILE_QUALITY
            - PROJECT_SUMMARY
            - PROJECT_SCHEDULE
            - PROJECT_REFERENCES
            - PROJECT_QUALITY
            - QUALITY_SUMMARY
            - QUALITY_DETAILS
            - QUALITY_AFFECTED
            - QUALITY_PROJECTS
            - QUALITY_SUPPLIER_ACCESS
            - QUALITY_HISTORY
            - TRAINING_SUMMARY
            - TRAINING_ITEMS
