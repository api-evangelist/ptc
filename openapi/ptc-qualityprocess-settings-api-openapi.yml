          type: string
          enum:
          - NON_REVISION_CONTROLLED
          - REVISION_SPECIFIC
          - REVISION_CONTROLLED
        private:
          type: boolean
    NumberFormatPrefixVo:
      type: object
      properties:
        guid:
          type: string
        value:
          type: string
    NumberSequencePrefixCompactResultRep:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/NumberFormatPrefixVo'
        count:
          type: integer
          format: int32
      xml:
