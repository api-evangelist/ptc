openapi: 3.2.0
info:
  title: Ptc Supplier Settings API
  version: '1.0'
  contact:
    email: arena-support@ptc.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://www.arenasolutions.com/terms/
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  description: 'Operations tagged Supplier Settings across 2 of this provider''s published API definitions: ptc-arena-openapi.json, ptc-arena-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /v1
- url: https://api.arenasolutions.com/v1
  description: Relative /v1 server resolved against api.arenasolutions.com, the host serving this spec
security:
- apiKeyAuth: []
- bearerAuth: []
- oauth2Auth: []
tags:
- name: Supplier Settings
  description: Manage settings for suppliers and supplier items (Attributes, Compliance Requirements).
paths:
  /settings/suppliers/approvalstatuses:
    get:
      tags:
      - Supplier Settings
      summary: List all supplier approval statuses
      operationId: getSupplierApprovalStatuses
      parameters:
      - name: name
        in: query
        schema:
          type: string
      - name: type
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierApprovalStatusResultRep'
    servers:
    - url: /v1
  /settings/suppliers/approvalstatuses/{approvalStatusGuid}:
    get:
      tags:
      - Supplier Settings
      summary: Get details of a specific supplier approval status
      operationId: getSupplierApprovalStatus
      parameters:
      - name: approvalStatusGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierApprovalStatusFullVo'
    servers:
    - url: /v1
components:
  schemas:
    SupplierApprovalStatusFullVo:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        description:
          type: string
        used:
          type: boolean
        active:
          type: boolean
        custom:
          type: boolean
        color:
          type: string
        guid:
          type: string
    ErrorObject:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    SupplierApprovalStatusResultRep:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SupplierApprovalStatusFullVo'
        count:
          type: integer
          format: int32
      xml:
        name: results
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorObject'
      xml:
        name: errors
  securitySchemes:
    oauth2Auth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://openauth.web.prod.bom.com:4431
          scopes: {}
    apiKeyAuth:
      type: apiKey
      name: arena_session_id
      in: header
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-refined-from:
- ptc-arena-openapi.json
- ptc-arena-openapi.yml
