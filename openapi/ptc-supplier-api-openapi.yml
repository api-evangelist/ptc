openapi: 3.2.0
info:
  title: Ptc Supplier API
  version: '1.0'
  contact:
    email: arena-support@ptc.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://www.arenasolutions.com/terms/
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  description: 'Operations tagged Supplier across 2 of this provider''s published API definitions: ptc-arena-openapi.json, ptc-arena-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /v1
- url: https://api.arenasolutions.com/v1
  description: Relative /v1 server resolved against api.arenasolutions.com, the host serving this spec
security:
- apiKeyAuth: []
- bearerAuth: []
- oauth2Auth: []
tags:
- name: Supplier
  description: 'Core supplier operations: search, create, update, delete, get profile, addresses, phone numbers, quality processes, and files.'
paths:
  /suppliers/{supplierGuid}:
    get:
      tags:
      - Supplier
      summary: Get details of a specific supplier
      description: Returns a Supplier object with a given GUID.
      operationId: getSupplier
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      - name: includeEmptyAdditionalAttributes
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SupplierFullVo'
    put:
      tags:
      - Supplier
      summary: Update information for a specific supplier
      description: Updates the metadata of a supplier with a given GUID. To update values for additional attributes, first retrieve the GUID of each attribute using the GET Supplier Item endpoint. Updated values must be valid for the attribute.
      operationId: updateSupplier
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierUpdateRequestVo'
            example:
              accountNumber: H0036878
              additionalAttributes:
              - guid: ZH1KYVZ1CTASBUDQT110
                value: Critical too
              approvalStatus: approved
              description: great source updated
              name: Avernet
              website: www.avernet.com
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SupplierFullVo'
    delete:
      tags:
      - Supplier
      summary: Delete a specific supplier
      operationId: deleteSupplier
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: No Content
          content:
            '*/*':
              schema:
                type: string
    servers:
    - url: /v1
  /suppliers/{supplierGuid}/phonenumbers/{phoneNumberGuid}:
    get:
      tags:
      - Supplier
      summary: Get details of a specific supplier phone number
      description: Returns a specific phone number with a given GUID of a Supplier object with a given GUID.
      operationId: getPhoneNumber
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      - name: phoneNumberGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierPhoneNumberVo'
    put:
      tags:
      - Supplier
      summary: Update a specific supplier phone number
      description: Updates the existing phone numbers of a supplier with a given GUID.
      operationId: updatePhoneNumber
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      - name: phoneNumberGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierPhoneNumberCreateVo'
            example:
              comment: Main line
              extension: x102
              label: Main
              number: 123-456-7890
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierPhoneNumberVo'
    delete:
      tags:
      - Supplier
      summary: Delete a specific supplier phone number
      description: Deletes a specific Supplier phone number with a given GUID.
      operationId: deletePhoneNumber
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      - name: phoneNumberGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: No Content
          content:
            '*/*':
              schema:
                type: string
    servers:
    - url: /v1
  /suppliers/{supplierGuid}/contacts/{contactGuid}:
    get:
      tags:
      - Supplier
      summary: Get details of a specific supplier contact
      description: Returns a specific contact object with a given GUID for a supplier with a given GUID.
      operationId: getContact
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      - name: contactGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierContactVo'
    put:
      tags:
      - Supplier
      summary: Update supplier contact
      description: Updates the supplier contact identified by contactGuid under the supplier identified by supplierGuid and returns the updated supplier contact representation.
      operationId: updateSupplierContact
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      - name: contactGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierContactShortVo'
            example:
              firstNames: John
              lastName: Smith
              title: Procurement Manager
              email: john.smith@supplier.com
              primary: true
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierContactVo'
    delete:
      tags:
      - Supplier
      summary: Delete supplier contact
      description: Deletes the supplier contact identified by contactGuid under the supplier identified by supplierGuid and returns no content.
      operationId: deleteSupplierContact
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      - name: contactGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: No Content
    servers:
    - url: /v1
  /suppliers/{supplierGuid}/contacts/{contactGuid}/phonenumbers/{phoneNumberGuid}:
    get:
      tags:
      - Supplier
      summary: Get details of a specific supplier contact phone number
      description: Returns a specific phone number object with a given GUID for a supplier contact with a given GUID.
      operationId: getContactPhoneNumber
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      - name: contactGuid
        in: path
        required: true
        schema:
          type: string
      - name: phoneNumberGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierContactPhoneNumberVo'
    put:
      tags:
      - Supplier
      summary: Update supplier contact phone number
      description: Updates the supplier contact phone number identified by phoneNumberGuid for contactGuid under supplierGuid and returns the updated supplier contact phone number representation.
      operationId: updateSupplierContactPhoneNumber
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      - name: contactGuid
        in: path
        required: true
        schema:
          type: string
      - name: phoneNumberGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSupplierContactPhoneNumberShortVo'
            examples:
              Update Personal Phone Number:
                description: Update Personal Phone Number
                value:
                  primary: true
                  phoneNumber:
                    label: FAX
                    number: 123-456-7890
                    extension: '1234'
              Update Company Phone Number:
                description: Update Company Phone Number
                value:
                  primary: true
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierContactPhoneNumberVo'
    delete:
      tags:
      - Supplier
      summary: Delete supplier contact phone number
      description: Deletes the supplier contact phone number identified by phoneNumberGuid for contactGuid under supplierGuid and returns no content.
      operationId: deleteSupplierContactPhoneNumber
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      - name: contactGuid
        in: path
        required: true
        schema:
          type: string
      - name: phoneNumberGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: No Content
    servers:
    - url: /v1
  /suppliers/{supplierGuid}/addresses/{addressGuid}:
    get:
      tags:
      - Supplier
      summary: Get details of a specific supplier address
      description: Returns a specific address with a given GUID of a Supplier object with a given GUID.
      operationId: getAddresse
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      - name: addressGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierAddressCompactVo'
    put:
      tags:
      - Supplier
      summary: Update a specific supplier address
      description: Updates an existing specific phone numbers of a supplier with a given GUID.
      operationId: updateAddresse
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      - name: addressGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierAddressCreateVo'
            example:
              address:
                address1: 1982 Lundy Ave.
                address2: Box 100
                city: San Jose
                country: United States
                label: main
                postalCode: '95131'
                province: null
                state: CALIFORNIA
              primary: false
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierAddressCompactVo'
    delete:
      tags:
      - Supplier
      summary: Delete a specific supplier address
      description: Deletes a specific Supplier address with a given GUID.
      operationId: deleteAddresse
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      - name: addressGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: No Content
          content:
            '*/*':
              schema:
                type: string
    servers:
    - url: /v1
  /suppliers:
    get:
      tags:
      - Supplier
      summary: Search for suppliers using filters like name
      description: Returns a collection of Supplier objects matching the given search criteria.
      operationId: getSuppliers
      parameters:
      - name: name
        in: query
        description: supplier name
        schema:
          type: string
      - name: supplierId
        in: query
        description: supplier unique identifier
        schema:
          type: string
      - name: offset
        in: query
        description: query result offset (default 0)
        schema:
          type: integer
      - name: limit
        in: query
        description: query result limit (default 20, max 400)
        schema:
          type: integer
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/QueryResultRepSupplierFullVo'
    post:
      tags:
      - Supplier
      summary: Create a new supplier
      description: 'NOTES:

        1. The values you specify for attributes must match the attribute types specified in the workspace. For example, when specifying a value for a predefined list, the value must be one of the allowed values.

        2. Number values must appear in quotation marks.'
      operationId: createSupplier
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierCreateRequestVo'
            example:
              accountNumber: '1'
              additionalAttributes:
              - guid: ZH1KYVZ1CTASBUDQT110
                value: Critical
              addresses:
              - primary: true
                address:
                  label: HQ
                  address1: 1 Main St
                  address2: Box 100
                  city: San Bruno
                  state: California
                  province: ''
                  postalCode: '94066'
                  country: United States
              approvalStatus: approved
              description: ONE
              name: Chris' Crafts
              phoneNumbers:
              - number: 111-111-1111
                label: Main
              - number: 111-111-1110
                label: Fax
              website: www.one.com
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SupplierFullVo'
    servers:
    - url: /v1
  /suppliers/{supplierGuid}/phonenumbers:
    get:
      tags:
      - Supplier
      summary: List all phone numbers associated with a supplier
      description: Returns the phone numbers of a Supplier object with a given GUID.
      operationId: getPhoneNumbers
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierPhoneNumberVoResultRep'
    post:
      tags:
      - Supplier
      summary: Add a new phone number to a supplier
      description: Creates a new phone number for a Supplier object.
      operationId: createPhoneNumbers
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierPhoneNumberCreateVo'
            example:
              comment: Main line
              extension: x101
              label: Main
              number: 123-456-7890
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierPhoneNumberVo'
    servers:
    - url: /v1
  /suppliers/{supplierGuid}/contacts:
    get:
      tags:
      - Supplier
      summary: List all contacts associated with a supplier
      description: Returns a collection of contact objects for a supplier with a given GUID.
      operationId: getContacts
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierContactVoResultRep'
    post:
      tags:
      - Supplier
      summary: Create supplier contact
      description: Creates a new contact for the supplier identified by supplierGuid and returns the created supplier contact representation.
      operationId: createSupplierContact
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierContactShortVo'
            example:
              firstNames: John
              lastName: Smith
              title: Procurement Manager
              email: john.smith@supplier.com
              primary: true
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierContactVo'
    servers:
    - url: /v1
  /suppliers/{supplierGuid}/contacts/{contactGuid}/phonenumbers:
    get:
      tags:
      - Supplier
      summary: List all phone numbers associated with a supplier contact
      description: Returns a collection of phone number objects for a supplier contact with a given GUID.
      operationId: getContactPhoneNumbers
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      - name: contactGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierContactPhoneNumberVoResultRep'
    post:
      tags:
      - Supplier
      summary: Create supplier contact phone number
      description: Creates a new phone number for the supplier contact identified by contactGuid under supplierGuid and returns the created supplier contact phone number representation.
      operationId: createSupplierContactPhoneNumber
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      - name: contactGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupplierContactPhoneNumberShortVo'
            examples:
              Create Personal Phone Number:
                description: Create Personal Phone Number
                value:
                  phoneType: PERSONAL
                  primary: true
                  phoneNumber:
                    label: FAX
                    number: 123-456-7890
                    extension: '1234'
              Create Company Phone Number:
                description: Create Company Phone Number
                value:
                  phoneType: COMPANY
                  primary: true
                  phoneNumber:
                    guid: 7P9SXNM47GZ5O7C13YNS
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierContactPhoneNumberVo'
    servers:
    - url: /v1
  /suppliers/{supplierGuid}/contacts/{contactGuid}/companyaddresses:
    get:
      tags:
      - Supplier
      summary: List all company addresses associated with a supplier contact
      description: Returns a collection of company address objects for a supplier contact with a given GUID.
      operationId: getContactAddresses
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      - name: contactGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierContactAddressVoResultRep'
    post:
      tags:
      - Supplier
      summary: Create supplier contact company address
      description: Creates a new company address for the supplier contact identified by contactGuid under supplierGuid and returns the created supplier contact company address representation.
      operationId: createSupplierContactAddress
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      - name: contactGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierContactAddressShortVo'
            example:
              address:
                guid: N5P8D32KNW07Q9MYMJW9
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierContactAddressVo'
    servers:
    - url: /v1
  /suppliers/{supplierGuid}/addresses:
    get:
      tags:
      - Supplier
      summary: List all addresses associated with a supplier
      description: Returns the addresses a Supplier object with a given GUID.
      operationId: getAddresses
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierAddressCompactVoResultRep'
    post:
      tags:
      - Supplier
      summary: Add a new address to a supplier
      description: Creates new addresses for a Supplier object.
      operationId: createAddresses
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierAddressCreateVo'
            example:
              address:
                address1: 1982 Lundy Ave.
                address2: null
                city: San Jose
                country: United States
                label: main
                postalCode: '95131'
                province: null
                state: CALIFORNIA
              primary: false
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierAddressCompactVo'
    servers:
    - url: /v1
  /suppliers/{supplierGuid}/contacts/{contactGuid}/companyaddresses/{addressGuid}:
    get:
      tags:
      - Supplier
      summary: Get details of a specific supplier contact company address
      description: Returns a specific company address object with a given GUID for a supplier contact with a given GUID.
      operationId: getContactAddress
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      - name: contactGuid
        in: path
        required: true
        schema:
          type: string
      - name: addressGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierContactAddressVo'
    delete:
      tags:
      - Supplier
      summary: Delete supplier contact company address
      description: Deletes the supplier contact company address identified by addressGuid for contactGuid under supplierGuid and returns no content.
      operationId: deleteSupplierContactAddress
      parameters:
      - name: supplierGuid
        in: path
        required: true
        schema:
          type: string
      - name: contactGuid
        in: path
        required: true
        schema:
          type: string
      - name: addressGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
