openapi: 3.2.0
info:
  title: Ptc Requirement Settings API
  version: '1.0'
  contact:
    email: arena-support@ptc.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://www.arenasolutions.com/terms/
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  description: 'Operations tagged Requirement Settings across 2 of this provider''s published API definitions: ptc-arena-openapi.json, ptc-arena-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /v1
- url: https://api.arenasolutions.com/v1
  description: Relative /v1 server resolved against api.arenasolutions.com, the host serving this spec
security:
- apiKeyAuth: []
- bearerAuth: []
- oauth2Auth: []
tags:
- name: Requirement Settings
  description: Manage settings for requirements (Templates, Attributes).
paths:
  /settings/{objectType}/numbersequences:
    get:
      tags:
      - Requirement Settings
      summary: List all number sequences for a given type
      description: List all number sequences for a given type. Supports Requests, Changes, Tickets, and Training Plan objects.
      operationId: getNumberSequences
      parameters:
      - name: objectType
        in: path
        required: true
        schema:
          type: string
          enum:
          - qualityprocesses
          - requests
          - changes
          - tickets
          - trainingplans
          - requirements
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberSequenceResultRep'
    servers:
    - url: /v1
  /settings/{objectType}/numbersequences/{guid}:
    get:
      tags:
      - Requirement Settings
      summary: Get details of a specific number sequence
      description: Get details of a specific number sequencefor Requests, Changes, Tickets, and Training Plans.
      operationId: getNumberSequence
      parameters:
      - name: objectType
        in: path
        required: true
        schema:
          type: string
          enum:
          - qualityprocesses
          - requests
          - changes
          - tickets
          - trainingplans
          - requirements
      - name: guid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberSequenceCompactVo'
    servers:
    - url: /v1
  /settings/{objectType}/numbersequenceprefixes:
    get:
      tags:
      - Requirement Settings
      summary: List all prefixes for number sequences for a given type
      description: List all prefixes for number sequences for a given type. Supports Requests, Changes, Tickets, and Training Plan objects.
      operationId: getNumberSequencePrefixes
      parameters:
      - name: objectType
        in: path
        required: true
        schema:
          type: string
          enum:
          - qualityprocesses
          - requests
          - changes
          - tickets
          - trainingplans
          - requirements
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberSequencePrefixCompactResultRep'
    servers:
    - url: /v1
  /settings/requirements/templates:
    get:
      tags:
      - Requirement Settings
      summary: List all requirements templates
      operationId: getRequirementTemplates
      parameters:
      - name: name
        in: query
        schema:
          type: string
      - name: active
        in: query
        schema:
          type: boolean
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementTemplateResultRep'
    servers:
    - url: /v1
  /settings/requirements/templates/{requirementTemplateGuid}:
    get:
      tags:
      - Requirement Settings
      summary: Get details of a specific requirement template
      operationId: getRequirementTemplate
      parameters:
      - name: requirementTemplateGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyTemplateVo'
    servers:
    - url: /v1
  /settings/requirements/relationshipTypes:
    get:
      tags:
      - Requirement Settings
      summary: List all relationship types for requirements
      operationId: getRelationshipTypes
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '417':
          description: Expectation Failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipTypeVoResultRep'
    servers:
    - url: /v1
components:
  schemas:
    ErrorObject:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    NumberSequenceCompactVo:
      type: object
      properties:
        guid:
          type: string
        lastUsed:
          type: string
        name:
          type: string
        nextValue:
          type: string
        prefixes:
          type: array
          items:
            $ref: '#/components/schemas/NumberFormatPrefixVo'
        creationDateTime:
          type: string
    VerifyTemplateVo:
      type: object
      properties:
        active:
          type: boolean
        allowUserDefinedNumber:
          type: boolean
        creationDateTime:
          type: string
        creator:
          $ref: '#/components/schemas/UserCompactVo'
        defaultAssignee:
          $ref: '#/components/schemas/UserCompactVo'
        defaultNumberSequence:
          $ref: '#/components/schemas/NumberFormatWithDefaultVo'
        defaultTemplate:
          type: boolean
        description:
          type: string
        guid:
          type: string
        name:
          type: string
        numberSequences:
          type: array
          items:
            $ref: '#/components/schemas/NumberFormatWithDefaultVo'
    RequirementTemplateVo:
      type: object
      properties:
        active:
          type: boolean
        allowUserDefinedNumber:
          type: boolean
        creationDateTime:
          type: string
        creator:
          $ref: '#/components/schemas/UserCompactVo'
        defaultAssignee:
          $ref: '#/components/schemas/UserCompactVo'
        defaultNumberSequence:
          $ref: '#/components/schemas/NumberFormatWithDefaultVo'
        defaultTemplate:
          type: boolean
        description:
          type: string
        folder:
          $ref: '#/components/schemas/FolderVo'
        guid:
          type: string
        name:
          type: string
        numberSequences:
          type: array
          items:
            $ref: '#/components/schemas/NumberFormatWithDefaultVo'
    RelationshipTypeVoResultRep:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/RelationshipTypeVo'
        count:
          type: integer
          format: int32
      xml:
        name: results
    FolderVo:
      type: object
      properties:
        guid:
          type: string
        name:
          type: string
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorObject'
      xml:
        name: errors
    RequirementTemplateResultRep:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/RequirementTemplateVo'
        count:
          type: integer
          format: int32
      xml:
        name: results
    NumberFormatWithDefaultVo:
      type: object
      properties:
        guid:
          type: string
        name:
          type: string
        prefixes:
          type: array
          items:
            $ref: '#/components/schemas/NumberFormatPrefixVo'
    UserCompactVo:
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        guid:
          type: string
    NumberSequenceResultRep:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/NumberSequenceCompactVo'
        count:
          type: integer
          format: int32
      xml:
        name: results
    NumberFormatPrefixVo:
      type: object
      properties:
        guid:
          type: string
        value:
          type: string
    RelationshipTypeVo:
      type: object
      properties:
        guid:
          type: string
        name:
          type: string
        active:
          type: boolean
        upstreamLabel:
          type: string
        downstreamLabel:
          type: string
        description:
          type: string
    NumberSequencePrefixCompactResultRep:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/NumberFormatPrefixVo'
        count:
          type: integer
          format: int32
      xml:
        name: results
  securitySchemes:
    oauth2Auth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://openauth.web.prod.bom.com:4431
          scopes: {}
    apiKeyAuth:
      type: apiKey
      name: arena_session_id
      in: header
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-refined-from:
- ptc-arena-openapi.json
- ptc-arena-openapi.yml
