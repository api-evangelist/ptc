apis:
- name: ThingWorx REST API
  description: >-
    The ThingWorx Industrial IoT platform REST API enables developers to interact with Things, Properties,
    Services, Events, and Subscriptions via HTTP. Authentication uses an AppKey passed as an HTTP header.
    Supports building, connecting, and deploying IIoT applications.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.ptc.com/en/products/thingworx
  baseURL: https://{your-thingworx-host}/Thingworx
  tags:
  - Industrial IoT
  - REST
  - Manufacturing
  tags_raw:
  - Industrial IoT
  - IIoT
  - REST
  - Manufacturing
